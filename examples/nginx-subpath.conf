# 把 gumonitor 挂在某个 URL **子路径**下的 nginx 片段（参考实现）
#
# 这里演示的是 /monitor/ 这个子路径。它解决的是一个通用问题，而不是本项目的特殊需求：
# 服务本身监听 127.0.0.1:8090，如果设备防火墙默认拒绝入站（很常见），
# 与其再开一个端口，不如借已经放行的 80/443 反代过去。
#
# 用法：把下面两个 location 块插进你 server{} 里，再 nginx -t && nginx -s reload。
#
# ⚠️ 关键点：proxy_pass 结尾的**斜杠**。它会把 /monitor/ 前缀剥掉再转发，
#    所以前端必须只用**相对路径**（app.css / app.js / api/state），
#    否则在子路径下会 404。本项目的前端就是这么写的。
#    如果你改成 `proxy_pass http://127.0.0.1:8090;`（不带斜杠），
#    则要保证服务端自己能处理 /monitor/ 前缀 —— 两者只能选一种。

	location = /monitor {
		return 301 /monitor/;
	}

	location /monitor/ {
		proxy_pass http://127.0.0.1:8090/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 60s;
		# 遥测数据每秒都在变，关掉缓冲免得看到"延迟几秒"的假象
		proxy_buffering off;
	}
